[package]
name = "nd-platform"
description = "Notideck OS abstraction: traits plus per-OS implementations"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `native` enables the real OS implementations. nd-core depends on this crate
# with default-features = false so it only sees the traits.
default = ["native"]
native = ["dep:sysinfo"]

[dependencies]
serde.workspace = true
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network"], optional = true }
png = "0.18.1"
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
jpeg-encoder = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
zbus = "5.19.0"
x11rb = { version = "0.13", default-features = false }
zune-jpeg = "0.5"
libc = "0.2"
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com_StructuredStorage",
    "Media",
    "Media_Control",
    "Foundation",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation_Collections",
] }
