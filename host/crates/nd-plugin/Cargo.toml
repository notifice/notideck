[package]
name = "nd-plugin"
description = "Notideck plugin host: manifests, discovery, process supervision, JSON-RPC over a local WebSocket (SPEC §8, docs/PLUGINS.md)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nd-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
base64.workspace = true
rand.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
resvg = { version = "0.48.1", default-features = false, features = ["raster-images"] }

[dev-dependencies]
tempfile = "3.27.0"
