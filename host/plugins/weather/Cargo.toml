[package]
name = "notideck-plugin-weather"
description = "Notideck sample plugin: current weather from Open-Meteo"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "weather"
path = "src/main.rs"

[dependencies]
nd-plugin-sdk = { path = "../../crates/nd-plugin-sdk" }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
serde_json.workspace = true
ureq = { version = "2", default-features = false, features = ["tls"] }
