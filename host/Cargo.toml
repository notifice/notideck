[workspace]
resolver = "2"
members = [
    "crates/nd-proto",
    "crates/nd-core",
    "crates/nd-platform",
    "crates/nd-transport",
    "crates/nd-media",
    "crates/nd-vcam",
    "crates/nd-obs",
    "crates/nd-plugin",
    "crates/nd-agent",
    "crates/nd-fakephone",
    "crates/nd-config",
    "crates/nd-vcam-dll",
    "crates/nd-plugin-sdk",
    "plugins/clock",
    "plugins/http",
    "plugins/weather",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.89"
repository = "https://github.com/notifice/notideck"

[workspace.dependencies]
# internal
nd-proto = { path = "crates/nd-proto" }
nd-core = { path = "crates/nd-core" }
nd-platform = { path = "crates/nd-platform", default-features = false }
nd-transport = { path = "crates/nd-transport" }
nd-media = { path = "crates/nd-media" }
nd-vcam = { path = "crates/nd-vcam" }
nd-obs = { path = "crates/nd-obs" }
nd-plugin = { path = "crates/nd-plugin" }
nd-config = { path = "crates/nd-config" }
nd-fakephone = { path = "crates/nd-fakephone" }

# external
anyhow = "1"
thiserror = "1"
bytes = "1"
prost = "0.13"
prost-build = "0.13"
protoc-bin-vendored = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# security (round 5, ADR 0004)
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
x509-parser = "0.16"

# discovery (round 5)
mdns-sd = "0.21.5"
if-addrs = "0.15.0"
