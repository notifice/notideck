plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.squareup.wire'
}

android {
    namespace 'dev.notideck'
    compileSdk 34

    defaultConfig {
        applicationId "dev.notideck"
        minSdk 26
        targetSdk 34
        versionCode 200
        versionName "0.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            // Conscrypt ships native TLS code per ABI; real phones are arm only (x86 = emulators).
            ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// One source of truth for the pairing test vectors (ADR 0004 §4): copied into the unit-test resources.
def copyPairingVectors = tasks.register('copyPairingVectors', Copy) {
    from "$rootDir/../docs/pairing-vectors.json"
    into layout.buildDirectory.dir('generated/pairingVectors')
}
android.sourceSets.test.resources.srcDir(layout.buildDirectory.dir('generated/pairingVectors'))
tasks.configureEach { t ->
    if (t.name.endsWith('UnitTestJavaRes')) t.dependsOn(copyPairingVectors)
}

// Protobuf codegen from the shared schema (SPEC §5). Generates dev.notideck.proto.v1.*
wire {
    sourcePath {
        srcDir "$rootDir/../proto"
    }
    kotlin {}
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.wire:wire-runtime:6.4.5'

    // TLS 1.3 on Android 9 (ADR 0004), QR scanner without Play Services.
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.zxing:core:3.5.3'

    // Round 20: built-in HLS player (1.3.x is the last line that builds against compileSdk 34).
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
